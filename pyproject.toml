[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inventario-ti"
version = "1.0.0"
description = "Sistema de inventario e gestao de ativos de TI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.5,<6",
  "Django>=5.2,<5.3",
  "django-filter>=25.1,<26",
  "djangorestframework>=3.18.2,<3.19",
  "djangorestframework-simplejwt>=5.5,<6",
  "drf-spectacular>=0.28,<0.29",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "qrcode[pil]>=8.2,<9",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "pytest-django>=4.11,<5",
  "pip-audit>=2.9,<3",
  "ruff>=0.12,<0.13",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--cov=apps --cov=config --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
