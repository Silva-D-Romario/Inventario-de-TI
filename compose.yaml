services:
  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-inventario_ti}
      POSTGRES_USER: ${POSTGRES_USER:-inventario_ti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventario_ti}
      POSTGRES_HOST: database
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventario_ti}
      POSTGRES_USER: ${POSTGRES_USER:-inventario_ti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventario_ti}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario_ti -d inventario_ti"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
