name: Qualidade Python

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validar formatação
        run: ruff format --check .

      - name: Executar análise estática
        run: ruff check .

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Validar configuração de produção
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-production-secret-key-with-at-least-fifty-characters-2026
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy

      - name: Validar contrato OpenAPI
        run: python manage.py spectacular --file /tmp/openapi.yml --validate

      - name: Executar testes
        run: pytest

      - name: Auditar dependências
        run: pip-audit --skip-editable

      - name: Validar build Docker
        run: docker build -t inventario-ti:ci .
